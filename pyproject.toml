[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-qa"
version = "0.1.0"
description = "A small RAG tool that lets you ask questions over your own PDFs and Markdown notes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Peter", email = "sege.peter@example.com" }
]
dependencies = [
    "click>=8.1.0",
    "pypdf>=4.0.0",
    "chromadb>=0.4.22",
    "anthropic>=0.20.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "openai>=1.0.0",
]

[project.scripts]
notes-qa = "notes_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
